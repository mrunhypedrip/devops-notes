services:
  api:
    build: .
    environment: [ REDIS_HOST=cache ]
    networks: [ backend-net ]

  cache:
    image: redis:7-alpine
    networks: [ backend-net ]

  proxy:
    image: nginx:alpine
    ports: [ "8080:80" ]
    volumes: [ ./nginx.conf:/etc/nginx/nginx.conf:ro ]
    depends_on: [ api ]
    networks: [ backend-net ]

networks:
  backend-net:
    driver: bridge
