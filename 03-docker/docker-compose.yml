version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=cache
    networks:
      - backend-net
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    networks:
      - backend-net
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - backend-net
    restart: unless-stopped

networks:
  backend-net:
    driver: bridge
