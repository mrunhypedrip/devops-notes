apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels: { app: python-api }
  template:
    metadata:
      labels: { app: python-api }
    spec:
      containers:
      - name: api
        image: python:3.11-slim
        resources:
          requests: { memory: "64Mi", cpu: "100m" }
          limits: { memory: "128Mi", cpu: "250m" }
